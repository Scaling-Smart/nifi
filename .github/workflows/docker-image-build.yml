name: Build NiFi Docker Image

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
      - name: Build Docker image with Maven
        run: mvn -Pdocker -pl nifi-docker/dockermaven -am -DskipTests package